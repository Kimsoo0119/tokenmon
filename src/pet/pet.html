<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  #wrap { position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center; }
  #sprite { width: 140px; height: 140px; object-fit: contain; image-rendering: pixelated;
    -webkit-user-drag: none; cursor: grab; display: none; }
  #sprite.attacking { animation: attack .35s ease-out; filter: brightness(1.8); }
  #sprite.notifying { animation: jump .45s ease-out 2; }
  @keyframes jump {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-22px) scale(1.04); }
    70% { transform: translateY(0); }
    85% { transform: translateY(-6px); }
  }
  @keyframes attack {
    0% { transform: translateX(0); }
    35% { transform: translateX(26px) scale(1.08); }
    65% { transform: translateX(-8px); }
    100% { transform: translateX(0); }
  }
  #sprite.captured { animation: capture .38s ease-in forwards; }
  @keyframes capture { to { transform: translateY(16px) scale(.08); opacity: 0; filter: brightness(3); } }
  #sprite.summoned { animation: summon .35s ease-out; }
  @keyframes summon {
    from { transform: translateY(20px) scale(.1); opacity: 0; filter: brightness(3); }
  }
  #sprite.dodge { animation: dodge .35s ease-out; }
  @keyframes dodge {
    30% { transform: translateX(-24px) scale(1.02); }
    100% { transform: translateX(0); }
  }
  #empty { font-size: 64px; cursor: pointer;
    transform-origin: 50% 92%; animation: wobble 3.2s ease-in-out infinite; }
  #empty img { width: 96px; -webkit-user-drag: none; vertical-align: middle; }
  @keyframes wobble {
    0%, 68%, 100% { transform: rotate(0deg); }
    72% { transform: rotate(-7deg); }
    77% { transform: rotate(6deg); }
    82% { transform: rotate(-4deg); }
    87% { transform: rotate(2deg); }
  }
  /* 몬스터볼 (PokeAPI 아이템 스프라이트): 이벤트 순간에만 날아와서 연출 */
  #ball { position: absolute; left: 50%; bottom: 4px; margin-left: -30px;
    width: 60px; height: 60px; image-rendering: pixelated; -webkit-user-drag: none;
    display: none; pointer-events: none; transform-origin: 50% 100%; }
  #ball.throwing { animation: throwIn .4s ease-in; }
  @keyframes throwIn {
    from { transform: translate(-140px, -140px) rotate(-540deg); }
    to { transform: translate(0, 0) rotate(0); }
  }
  #ball.wobbling { animation: ballWobble 1.2s ease-in-out infinite; }
  @keyframes ballWobble {
    0%, 55%, 100% { transform: rotate(0); }
    10% { transform: rotate(-14deg); }
    25% { transform: rotate(12deg); }
    40% { transform: rotate(-7deg); }
    50% { transform: rotate(3deg); }
  }
  #ball.caught { animation: caught .5s ease; }
  @keyframes caught {
    0% { transform: scale(1); filter: brightness(1); }
    30% { transform: scale(.9); filter: brightness(1.7); }
    60% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  #ball.burst { animation: burst .3s ease-out forwards; }
  @keyframes burst { to { transform: scale(1.8); opacity: 0; } }
  #ball.missOut { animation: missOut .5s ease-in forwards; }
  @keyframes missOut {
    30% { transform: translate(40px, -30px) rotate(180deg); }
    100% { transform: translate(110px, 50px) rotate(540deg); opacity: 0; }
  }
  /* 작업 중 세션 수 배지 (창 우상단, 펫 어깨 위) */
  #badge { position: absolute; top: 2px; right: 2px; pointer-events: none; display: none;
    background: rgba(24,24,27,.95); color: #ffb340;
    border: 1px solid rgba(255,255,255,.12); border-radius: 9px;
    padding: 1px 6px; font: 600 11px ui-monospace, 'SF Mono', Menlo, monospace;
    font-variant-numeric: tabular-nums; }
  #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,.95) 15%, rgba(255,255,255,0) 65%); }
  #flash.on { animation: flashAnim 1s ease; }
  @keyframes flashAnim { 0% {opacity:0} 40% {opacity:1} 60% {opacity:1} 100% {opacity:0} }
</style>
<div id="wrap">
  <div id="empty" title="클릭해서 몬스터를 추가하세요"><img
    src="https://img.pokemondb.net/sprites/home/normal/egg.png"
    onerror="this.replaceWith('🥚')"></div>
  <img id="sprite">
  <img id="ball" src="../../assets/pokeball.png">
  <div id="badge"></div>
  <div id="flash"></div>
</div>
<script src="pet.js"></script>
