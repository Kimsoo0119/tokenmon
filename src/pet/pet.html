<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  #wrap { position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  #sprite { width: 140px; height: 140px; object-fit: contain; image-rendering: pixelated;
    -webkit-user-drag: none; cursor: grab; display: none; }
  #sprite.attacking { animation: attack .35s ease-out; filter: brightness(1.8); }
  #sprite.notifying { animation: jump .45s ease-out 2; }
  @keyframes jump {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-22px) scale(1.04); }
    70% { transform: translateY(0); }
    85% { transform: translateY(-6px); }
  }
  #bubble b.notice { color: #7ec8ff; font: inherit; font-weight: 700; }
  @keyframes attack {
    0% { transform: translateX(0); }
    35% { transform: translateX(26px) scale(1.08); }
    65% { transform: translateX(-8px); }
    100% { transform: translateX(0); }
  }
  #empty { font-size: 64px; cursor: default; margin-bottom: 30px; }
  /* 에이전트 작업 중 몬스터볼 (PokeAPI 아이템 스프라이트, 30px 원본을 2배 정수 스케일) */
  #ballWrap { position: relative; display: none; margin-bottom: 24px; }
  #ball { width: 60px; height: 60px; image-rendering: pixelated; -webkit-user-drag: none;
    display: block; cursor: grab; transform-origin: 50% 100%; }
  /* 동시 작업 세션 수 배지 (2개 이상일 때만) */
  #ballCount { position: absolute; top: -8px; right: -18px; pointer-events: none; display: none;
    background: rgba(24,24,27,.95); color: #ffb340;
    border: 1px solid rgba(255,255,255,.12); border-radius: 9px; padding: 1px 6px;
    font: 600 11px ui-monospace, 'SF Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
  #ball.wobbling { animation: wobble 1.6s ease-in-out infinite; }
  @keyframes wobble {
    0%, 55%, 100% { transform: rotate(0); }
    10% { transform: rotate(-14deg); }
    25% { transform: rotate(12deg); }
    40% { transform: rotate(-7deg); }
    50% { transform: rotate(3deg); }
  }
  #ball.caught { animation: caught .5s ease; }
  @keyframes caught {
    0% { transform: scale(1); filter: brightness(1); }
    30% { transform: scale(.9); filter: brightness(1.7); }
    60% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  #ball.burst { animation: burst .3s ease-out forwards; }
  @keyframes burst { to { transform: scale(1.8); opacity: 0; } }
  #sprite.captured { animation: capture .4s ease-in forwards; }
  @keyframes capture { to { transform: translateY(16px) scale(.08); opacity: 0; filter: brightness(3); } }
  #bubble { margin-bottom: 10px; position: relative;
    background: rgba(24,24,27,.95); color: #ececf0;
    border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
    padding: 6px 12px; white-space: normal; word-break: keep-all; text-align: center;
    max-width: calc(100vw - 28px); display: none;
    font: 12px 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    animation: bubblePop .18s cubic-bezier(.2,.9,.3,1.3); }
  #bubble::after { content: ''; position: absolute; left: 50%; top: 100%;
    transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: rgba(24,24,27,.95); }
  #bubble b { font: 600 12px ui-monospace, 'SF Mono', Menlo, monospace;
    font-variant-numeric: tabular-nums; color: #ffb340; }
  @keyframes bubblePop { from { opacity: 0; transform: translateY(5px) scale(.94); } }
  #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 65%, rgba(255,255,255,.95) 15%, rgba(255,255,255,0) 65%); }
  #flash.on { animation: flashAnim 1s ease; }
  @keyframes flashAnim { 0% {opacity:0} 40% {opacity:1} 60% {opacity:1} 100% {opacity:0} }
</style>
<div id="wrap">
  <div id="bubble"></div>
  <div id="empty" title="트레이 → 설정에서 몬스터를 추가하세요">🥚</div>
  <img id="sprite">
  <div id="ballWrap">
    <img id="ball" src="../../assets/pokeball.png" title="클릭하면 나옵니다">
    <div id="ballCount"></div>
  </div>
  <div id="flash"></div>
</div>
<script src="pet.js"></script>
