<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Galmuri9';
    src: url('../../assets/Galmuri9.woff2') format('woff2');
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  #wrap { position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  #sprite { width: 140px; height: 140px; object-fit: contain; image-rendering: pixelated;
    -webkit-user-drag: none; cursor: grab; display: none; }
  #sprite.attacking { animation: attack .35s ease-out; filter: brightness(1.8); }
  #sprite.notifying { animation: jump .45s ease-out 2; }
  @keyframes jump {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-22px) scale(1.04); }
    70% { transform: translateY(0); }
    85% { transform: translateY(-6px); }
  }
  @keyframes attack {
    0% { transform: translateX(0); }
    35% { transform: translateX(26px) scale(1.08); }
    65% { transform: translateX(-8px); }
    100% { transform: translateX(0); }
  }
  #sprite.captured { animation: capture .38s ease-in forwards; }
  @keyframes capture { to { transform: translateY(16px) scale(.08); opacity: 0; filter: brightness(3); } }
  #sprite.summoned { animation: summon .35s ease-out; }
  @keyframes summon {
    from { transform: translateY(20px) scale(.1); opacity: 0; filter: brightness(3); }
  }
  #sprite.dodge { animation: dodge .35s ease-out; }
  @keyframes dodge {
    30% { transform: translateX(-24px) scale(1.02); }
    100% { transform: translateX(0); }
  }
  #empty { font-size: 64px; cursor: default; margin-bottom: 30px; }
  /* 몬스터볼 (PokeAPI 아이템 스프라이트): 이벤트 순간에만 날아와서 연출 */
  #ball { position: absolute; left: 50%; bottom: 30px; margin-left: -30px;
    width: 60px; height: 60px; image-rendering: pixelated; -webkit-user-drag: none;
    display: none; pointer-events: none; transform-origin: 50% 100%; }
  #ball.throwing { animation: throwIn .4s ease-in; }
  @keyframes throwIn {
    from { transform: translate(-150px, -130px) rotate(-540deg); }
    to { transform: translate(0, 0) rotate(0); }
  }
  #ball.wobbling { animation: wobble 1.2s ease-in-out infinite; }
  @keyframes wobble {
    0%, 55%, 100% { transform: rotate(0); }
    10% { transform: rotate(-14deg); }
    25% { transform: rotate(12deg); }
    40% { transform: rotate(-7deg); }
    50% { transform: rotate(3deg); }
  }
  #ball.caught { animation: caught .5s ease; }
  @keyframes caught {
    0% { transform: scale(1); filter: brightness(1); }
    30% { transform: scale(.9); filter: brightness(1.7); }
    60% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  #ball.burst { animation: burst .3s ease-out forwards; }
  @keyframes burst { to { transform: scale(1.8); opacity: 0; } }
  #ball.missOut { animation: missOut .5s ease-in forwards; }
  @keyframes missOut {
    30% { transform: translate(40px, -30px) rotate(180deg); }
    100% { transform: translate(120px, 40px) rotate(540deg); opacity: 0; }
  }
  /* 도트 대화창 (포켓몬 게임 스타일): 흰 배경 + 검정 이중 테두리 + ▼ */
  #bubble { margin-bottom: 10px; position: relative;
    background: #f8f8f0; color: #181810;
    border: 3px solid #181810; border-radius: 0;
    box-shadow: inset 0 0 0 2px #f8f8f0, inset 0 0 0 4px #98a0a8;
    padding: 8px 14px 10px 10px; white-space: normal; word-break: keep-all; text-align: center;
    max-width: calc(100vw - 28px); display: none;
    font: 11px 'Galmuri9', monospace; line-height: 1.5;
    image-rendering: pixelated; }
  #bubble::after { content: '▼'; position: absolute; right: 4px; bottom: 1px;
    font: 8px 'Galmuri9', monospace; color: #181810;
    animation: blinkCursor 1s steps(2, jump-none) infinite; }
  @keyframes blinkCursor { 50% { opacity: 0; } }
  #bubble b, #bubble b.notice { font: inherit; font-weight: 400; color: #d84020; }
  /* 작업 중 세션 수 도트 배지 (펫 오른쪽 위) */
  #badge { position: absolute; left: 50%; bottom: 136px; pointer-events: none; display: none;
    transform: translateX(76px);
    background: #f8f8f0; color: #181810; border: 2px solid #181810;
    padding: 1px 4px; font: 10px 'Galmuri9', monospace; }
  #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 65%, rgba(255,255,255,.95) 15%, rgba(255,255,255,0) 65%); }
  #flash.on { animation: flashAnim 1s ease; }
  @keyframes flashAnim { 0% {opacity:0} 40% {opacity:1} 60% {opacity:1} 100% {opacity:0} }
</style>
<div id="wrap">
  <div id="bubble"></div>
  <div id="empty" title="트레이 → 설정에서 몬스터를 추가하세요">🥚</div>
  <img id="sprite">
  <img id="ball" src="../../assets/pokeball.png">
  <div id="badge"></div>
  <div id="flash"></div>
</div>
<script src="pet.js"></script>
