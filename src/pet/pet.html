<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  /* 스프라이트를 창 상단에 붙이고 말풍선은 아래로: macOS가 창을 메뉴바 아래로
     클램프하므로, 위쪽 여백을 없애야 펫이 화면 최상단까지 올라감 */
  #wrap { position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  #sprite { width: 140px; height: 140px; object-fit: contain; image-rendering: pixelated;
    -webkit-user-drag: none; cursor: grab; display: none; }
  #sprite.attacking { animation: attack .35s ease-out; filter: brightness(1.8); }
  #sprite.notifying { animation: jump .45s ease-out 2; }
  @keyframes jump {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-22px) scale(1.04); }
    70% { transform: translateY(0); }
    85% { transform: translateY(-6px); }
  }
  #bubble b.notice { color: #7ec8ff; font: inherit; font-weight: 700; }
  @keyframes attack {
    0% { transform: translateX(0); }
    35% { transform: translateX(26px) scale(1.08); }
    65% { transform: translateX(-8px); }
    100% { transform: translateX(0); }
  }
  #empty { font-size: 64px; cursor: default; margin-top: 10px; }
  #bubble { margin-top: 10px; position: relative;
    background: rgba(24,24,27,.95); color: #ececf0;
    border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
    padding: 6px 12px; white-space: normal; word-break: keep-all; text-align: center;
    max-width: calc(100vw - 28px); display: none;
    font: 12px 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    animation: bubblePop .18s cubic-bezier(.2,.9,.3,1.3); }
  #bubble::after { content: ''; position: absolute; left: 50%; bottom: 100%;
    transform: translateX(-50%);
    border: 5px solid transparent; border-bottom-color: rgba(24,24,27,.95); }
  #bubble b { font: 600 12px ui-monospace, 'SF Mono', Menlo, monospace;
    font-variant-numeric: tabular-nums; color: #ffb340; }
  @keyframes bubblePop { from { opacity: 0; transform: translateY(-5px) scale(.94); } }
  #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.95) 15%, rgba(255,255,255,0) 65%); }
  #flash.on { animation: flashAnim 1s ease; }
  @keyframes flashAnim { 0% {opacity:0} 40% {opacity:1} 60% {opacity:1} 100% {opacity:0} }
</style>
<div id="wrap">
  <div id="empty" title="트레이 → 설정에서 몬스터를 추가하세요">🥚</div>
  <img id="sprite">
  <div id="bubble"></div>
  <div id="flash"></div>
</div>
<script src="pet.js"></script>
