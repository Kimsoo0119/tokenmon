<meta charset="utf-8">
<title>tokemon 설정</title>
<style>
  body { font-family: -apple-system; margin: 20px; font-size: 14px; }
  section { margin-bottom: 28px; }
  h2 { font-size: 15px; margin-bottom: 8px; }
  label { margin-right: 14px; }
  input[type=text] { width: 200px; }
  .thr { width: 110px; }
  li { margin: 8px 0; list-style: none; }
  ul { padding: 0; }
  .hint { color: #888; font-size: 12px; margin-top: 4px; }
  #poke-status { margin-left: 8px; color: #666; }
</style>
<body>
<section>
  <h2>사용량 소스</h2>
  <label><input type="radio" name="source" value="claude"> Claude</label>
  <label><input type="radio" name="source" value="codex"> Codex</label>
</section>
<section>
  <h2>포켓몬 추가</h2>
  <input id="poke-name" type="text" placeholder="한글 이름 (예: 피카츄)">
  <button id="poke-lookup">불러오기</button>
  <span id="poke-status"></span>
  <div>
    <select id="poke-paths" hidden></select>
    <button id="poke-add" hidden>추가</button>
  </div>
</section>
<section>
  <h2>커스텀 몬스터 (디지몬 등, GIF 직접 지정)</h2>
  <input id="custom-name" type="text" placeholder="이름">
  <input id="custom-files" type="file" accept=".gif" multiple>
  <button id="custom-add">추가</button>
  <div class="hint">파일명 정렬 순서 = 진화 순서</div>
</section>
<section>
  <h2>몬스터 목록</h2>
  <ul id="monsters"></ul>
  <div class="hint">임계값: 쉼표 구분, 오름차순, 개수 = 단계 수 - 1 (예: 33,66)</div>
</section>
<script src="settings.js"></script>
